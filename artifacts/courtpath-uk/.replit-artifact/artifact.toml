kind = "web"
previewPath = "/"
title = "CourtReady"
description = "CourtReady helps people organise rights, facts, dates and documents for UK civil and family court procedures with local-only drafting, source-linked rights guidance and printable exports."
version = "1.0.0"
id = "artifacts/courtpath-uk"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24407

[services.development]
run = "pnpm --filter @workspace/courtpath-uk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/courtpath-uk", "run", "build" ]
serve = "static"
publicDir = "artifacts/courtpath-uk/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24407"
BASE_PATH = "/"
