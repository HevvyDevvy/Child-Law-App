name: Deploy to GitHub Pages

on:
  push:
    branches: [replit-agent]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (resolve any lockfile drift)
        run: pnpm install --no-frozen-lockfile

      - name: Commit updated lockfile if it changed
        run: |
          set -e
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync pnpm-lock.yaml [skip ci]"
            git pull --rebase origin replit-agent
            git push origin HEAD:replit-agent
          else
            echo "Lockfile already in sync."
          fi

      - name: Build courtpath-uk
        run: pnpm --filter @workspace/courtpath-uk run build
        env:
          PORT: 5000
          BASE_PATH: /Child-Law-App/
          NODE_ENV: production

      - name: SPA fallback for GitHub Pages
        run: cp artifacts/courtpath-uk/dist/public/index.html artifacts/courtpath-uk/dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/courtpath-uk/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
